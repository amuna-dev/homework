<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Вход</h1>

    <!-- novalidate: проверяем поля сами, чтобы показать ошибку под полем -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" name="username" type="text" autocomplete="username"
               aria-describedby="username-error">
        <div id="username-error" class="field-error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               aria-describedby="password-error">
        <div id="password-error" class="field-error" aria-live="polite"></div>
      </div>

      <div id="form-error" class="form-error" role="alert" hidden></div>

      <button id="submit-btn" class="btn" type="submit">Войти</button>
    </form>

    <p class="hint">Тестовый аккаунт: emilys / emilyspass</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
